
services:
  postgres:
    image: postgres:16
    container_name: gearflow_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gearflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gearflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - gearflow_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - postgres__connectionString=Host=postgres;Database=gearflow_db;Username=postgres;Password=postgres
      - Seq__ServerUrl=http://seq
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:8080"
    restart: unless-stopped
    networks:
      - gearflow_network

  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seq_data:/data
    restart: unless-stopped
    networks:
      - gearflow_network

volumes:
  postgres_data:
  seq_data:

networks:
  gearflow_network:
